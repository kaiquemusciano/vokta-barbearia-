<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOKTA Barbearia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: #0f141c;
      --bg-card-hover: #161e2b;
      --accent-blue: #00f0ff;
      --accent-blue-glow: rgba(0, 240, 255, 0.25);
      --accent-blue-dark: #0088cc;
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(0, 240, 255, 0.3);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: linear-gradient(180deg, rgba(7, 9, 14, 0.95) 0%, #07090e 100%);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      height: 68px;
    }

    .btn-back {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-back:active {
      transform: scale(0.95);
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .brand-logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      height: 34px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 8px var(--accent-blue-glow));
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
      text-transform: uppercase;
    }

    .brand-title span {
      color: var(--accent-blue);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--border-accent);
      color: var(--accent-blue);
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-blue);
      box-shadow: 0 0 8px var(--accent-blue);
    }

    /* Content Sections */
    .content-section {
      display: none;
      padding: 20px;
      animation: fadeIn 0.25s ease forwards;
    }

    .content-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero Card */
    .hero-card {
      background: linear-gradient(135deg, rgba(15, 20, 28, 0.95) 0%, rgba(22, 30, 43, 0.85) 100%);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px var(--accent-blue-glow);
    }

    .hero-avatar {
      width: 86px;
      height: 86px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 2px solid var(--accent-blue);
      box-shadow: 0 0 20px var(--accent-blue-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      overflow: hidden;
    }

    .hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-greeting {
      font-size: 0.8rem;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .hero-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .badges-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .info-tag {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius-md);
      border: none;
      background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.4);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-main:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(0, 114, 255, 0.3);
    }

    /* Section Titles */
    .section-header {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .section-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Features List on Home */
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: left;
    }

    .feature-icon {
      font-size: 1.2rem;
      margin-bottom: 8px;
      display: block;
    }

    .feature-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .feature-desc {
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    /* Services Grid & Selection */
    .services-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .service-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
    }

    .service-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .service-card.selected {
      background: rgba(0, 240, 255, 0.08);
      border-color: var(--accent-blue);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }

    .service-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .service-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .service-price {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--accent-blue);
    }

    .checkbox-custom {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      pointer-events: none;
    }

    .service-card.selected .checkbox-custom {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .checkbox-custom::after {
      content: "✓";
      color: var(--bg-dark);
      font-weight: 900;
      font-size: 14px;
      display: none;
    }

    .service-card.selected .checkbox-custom::after {
      display: block;
    }

    /* Sticky Selection Bar */
    .sticky-bar {
      position: fixed;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 440px;
      background: rgba(15, 20, 28, 0.95);
      border: 1px solid var(--accent-blue);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      z-index: 90;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translate(-50%, 20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .sticky-info {
      display: flex;
      flex-direction: column;
    }

    .sticky-count {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .sticky-total {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-blue);
    }

    .btn-sm {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent-blue);
      color: var(--bg-dark);
      font-weight: 800;
      font-size: 0.85rem;
      cursor
