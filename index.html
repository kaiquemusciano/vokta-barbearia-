<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>VOKTA Barbearia | Agende seu horário</title>
<meta name="description" content="Agende seu corte, barba e mais na VOKTA Barbearia, em poucos toques.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--card:#13151b;--bd:#262a35;--blue:#0a64ff;--blue2:#0b3fb0;--ink:#eef2f8;--mut:#8b94a5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 Montserrat,system-ui,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#0b2a66,transparent 55%),var(--bg)}
main{max-width:480px;margin:0 auto;padding:0 18px calc(24px + env(safe-area-inset-bottom,0px))}
.hd{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:12px}
.lg{width:50px;height:50px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #0a64ff55,0 0 24px #0a64ff66}
.bn b{display:block;font-size:1.25rem;letter-spacing:.28em;font-weight:800;background:linear-gradient(180deg,#fff,#a9b6cc);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.bn span{font-size:.62rem;letter-spacing:.35em;color:var(--mut);font-weight:700}
.prog{height:4px;background:#1a1d26;border-radius:2px;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#6aa4ff);transition:width .6s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.st-in>*{animation:in .5s cubic-bezier(.2,.8,.2,1) both}.st-in>:nth-child(2){animation-delay:.07s}.st-in>:nth-child(3){animation-delay:.14s}.st-in>:nth-child(4){animation-delay:.2s}
.bub{background:linear-gradient(180deg,var(--blue),var(--blue2));border-radius:20px 20px 20px 6px;padding:14px 16px;margin:10px 0;max-width:94%;box-shadow:0 8px 24px #0a64ff30}
.in{width:100%;font:inherit;padding:15px;margin:14px 0 4px;border-radius:16px;border:1px solid var(--bd);background:#1a1d26;color:var(--ink);transition:.25s}
.in:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px #0a64ff30}
.er{color:#ff8a80;font-size:.85rem;min-height:1.3em;margin:4px 2px 8px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(180deg,#1a74ff,var(--blue2));box-shadow:0 8px 22px #0a64ff40;transition:transform .2s,opacity .2s;text-align:center;text-decoration:none}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;box-shadow:none}
.btn.g{background:#1b1e27;box-shadow:none;color:var(--mut)}.btn.s{background:#1b1e27;box-shadow:none;border:1px solid var(--bd)}
.row{display:flex;gap:10px}.row .g{flex:0 0 32%}
.svs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.sv{position:relative;text-align:left;padding:14px;min-height:112px;border-radius:18px;background:var(--card);border:1px solid var(--bd);color:var(--ink);font:inherit;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;cursor:pointer;transition:.25s}
.sv b{font-size:.95rem;line-height:1.25}.sv span{font-size:.82rem;color:var(--mut)}
.sv .ck{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:7px;border:2px solid #3a4150;transition:.25s}
.sv.on{background:linear-gradient(160deg,#0a64ff,#0b3fb0);border-color:#6aa4ff}.sv.on span{color:#dbe7ff}
.sv.on .ck{background:#fff;border-color:#fff}.sv.on .ck::after{content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid #0a64ff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.foot{position:sticky;bottom:0;padding:14px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 28%)}
.tot{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:700}.tot span{color:var(--mut);font-weight:500}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pro{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--bd);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;transition:.25s}
.pro:active{transform:scale(.97)}.pro:hover{border-color:var(--blue)}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-content:center;font-size:1.3rem;font-weight:800;background:linear-gradient(160deg,#1a74ff,#0b3fb0);box-shadow:0 0 0 3px #0a64ff44}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:12px -2px 6px;scroll-snap-type:x proximity;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.d{flex:0 0 64px;scroll-snap-align:start;padding:10px 0;border-radius:16px;background:var(--card);border:1px solid var(--bd);color:var(--ink);font:inherit;display:grid;justify-items:center;cursor:pointer;transition:.25s}
.d small{font-size:.65rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.d b{font-size:1.35rem;line-height:1.2}
.d.on{background:linear-gradient(160deg,#0a64ff,#0b3fb0);border-color:#6aa4ff}.d.on small{color:#dbe7ff}.d:disabled{opacity:.3}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.sl{padding:14px 0;border-radius:14px;background:#1b1e27;border:1px solid var(--bd);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.sl.on{background:linear-gradient(160deg,#0a64ff,#0b3fb0);border-color:#6aa4ff}.sl:disabled{opacity:.3;text-decoration:line-through;cursor:default}
.mut{color:var(--mut);font-size:.85rem}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 18px;margin:14px 0}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--bd)}.sum div:last-child{border:0}
.sum span{color:var(--mut)}.sum b{text-align:right}
.ok{text-align:center;padding-top:10px}.ok svg{width:96px;height:96px}
.ok circle{fill:none;stroke:#0a64ff;stroke-width:5;stroke-dasharray:290;stroke-dashoffset:290;animation:dr .8s .1s ease forwards}
.ok path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:dr .5s .7s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ok h2{margin:12px 0 4px}.ok .btn{margin-top:10px}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ok circle,.ok path{stroke-dashoffset:0}}
</style></head>
<body>
<header class="hd"><img class="lg" src="logo.png" alt="VOKTA Barbearia"><div class="bn"><b>VOKTA</b><span>BARBEARIA</span></div></header>
<main><div class="prog"><i id="pg"></i></div><section id="st"></section>
<p class="mut hide" id="dm" style="margin-top:22px;text-align:center">Modo demonstração: os agendamentos ficam salvos só neste aparelho.</p></main>
<script src="config.js"></script><script src="vokta.js"></script>
<script>
const C=window.VOKTA,$=q=>document.querySelector(q),st=$("#st");
const s={n:0,nome:"",fone:"",svc:[],barb:null,data:"",hora:""};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pn=()=>s.nome.split(" ")[0],sv=id=>C.servicos.find(x=>x.id===id),bb=id=>C.barbeiros.find(x=>x.id===id);
const total=()=>s.svc.reduce((a,id)=>a+sv(id).preco,0);
const fone=d=>d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
const dlong=d=>new Date(d+"T00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
const enter=(i,b)=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")$(b).click()});
function go(n){s.n=n;$("#pg").style.width=Math.min(100,n/6*100)+"%";V_[n]();st.classList.remove("st-in");void st.offsetWidth;st.classList.add("st-in");scrollTo({top:0,behavior:"smooth"})}
const back=n=>`<button class="btn g" id="vb">Voltar</button>`;
const V_=[
()=>{st.innerHTML=`<div class="bub">Olá, tudo bem? Sou a assistente virtual da <b>${esc(C.nome)}</b> e cuido do seu agendamento.</div><div class="bub">Qual o seu nome? Escreva nome e sobrenome, por favor.</div><input id="i" class="in" autocomplete="name" placeholder="Seu nome completo" value="${esc(s.nome)}"><p class="er" id="er"></p><button class="btn" id="ok">Enviar</button>`;
 enter("#i","#ok");$("#ok").onclick=()=>{const v=$("#i").value.trim().replace(/\s+/g," ");if(v.length<5||v.split(" ").length<2){$("#er").textContent="Escreva nome e sobrenome, por favor.";return}s.nome=v;go(1)}},
()=>{st.innerHTML=`<div class="bub">Prazer, ${esc(pn())}! Qual o seu WhatsApp, com DDD? Usamos só para confirmar seu horário.</div><input id="i" class="in" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" value="${esc(s.fone?fone(s.fone):"")}"><p class="er" id="er"></p><div class="row">${back()}<button class="btn" id="ok">Enviar</button></div>`;
 enter("#i","#ok");$("#vb").onclick=()=>go(0);$("#ok").onclick=()=>{const d=$("#i").value.replace(/\D/g,"").replace(/^55(?=\d{10,11}$)/,"");if(d.length<10||d.length>11){$("#er").textContent="Digite o número com DDD, por exemplo (13) 99999-9999.";return}s.fone=d;go(2)}},
()=>{st.innerHTML=`<div class="bub">Por qual serviço você está procurando? Pode escolher mais de um.</div><div class="svs">${C.servicos.map(x=>`<button class="sv ${s.svc.includes(x.id)?"on":""}" data-id="${x.id}"><i class="ck"></i><b>${esc(x.nome)}</b><span>${V.brl(x.preco)}${x.min?" · "+x.min+" min":""}</span></button>`).join("")}</div><div class="foot"><div class="tot"><span id="tn"></span><b id="tt"></b></div><div class="row">${back()}<button class="btn" id="ok">Continuar</button></div></div>`;
 const up=()=>{$("#tn").textContent=s.svc.length?s.svc.length+(s.svc.length>1?" serviços":" serviço"):"Nenhum serviço";$("#tt").textContent=V.brl(total());$("#ok").disabled=!s.svc.length};up();
 st.querySelectorAll(".sv").forEach(b=>b.onclick=()=>{const id=b.dataset.id;s.svc=s.svc.includes(id)?s.svc.filter(x=>x!==id):s.svc.concat(id);b.classList.toggle("on");up()});
 $("#vb").onclick=()=>go(1);$("#ok").onclick=()=>go(3)},
()=>{st.innerHTML=`<div class="bub">Ok! E qual profissional vai atender você?</div><div style="display:grid;gap:10px;margin:14px 0">${C.barbeiros.map(b=>`<button class="pro" data-id="${b.id}"><span class="av">${esc(b.nome[0])}</span>${esc(b.nome)}</button>`).join("")}</div><div class="row">${back()}</div>`;
 st.querySelectorAll(".pro").forEach(b=>b.onclick=()=>{s.barb=b.dataset.id;s.data="";s.hora="";go(4)});$("#vb").onclick=()=>go(2)},
()=>{const ds=[...Array(C.diasAFrente)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d}),aberto=d=>C.horario.dias.includes(d.getDay());
 if(!s.data){const f=ds.find(aberto);s.data=f?V.dk(f):""}
 st.innerHTML=`<div class="bub">Escolha o dia e o horário com ${esc(bb(s.barb).nome)}.</div><div class="days">${ds.map(d=>`<button class="d ${V.dk(d)===s.data?"on":""}" data-d="${V.dk(d)}" ${aberto(d)?"":"disabled"}><small>${d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","")}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")}</small></button>`).join("")}</div><div id="sl"></div><div class="foot"><div class="row">${back()}<button class="btn" id="ok" disabled>Continuar</button></div></div>`;
 const slots=async()=>{const box=$("#sl");box.innerHTML='<p class="mut">Carregando horários...</p>';let oc=[];
  try{oc=await V.ocupados(s.barb,s.data)}catch(e){box.innerHTML='<p class="er">Não consegui carregar os horários. Verifique a internet e tente de novo.</p>';return}
  const hj=V.dk(new Date())===s.data,agora=new Date().getHours()*60+new Date().getMinutes()+C.antecedenciaMin;
  const hs=V.horas().filter(h=>!hj||(+h.slice(0,2))*60+(+h.slice(3))>=agora);
  box.innerHTML=hs.length?`<div class="slots">${hs.map(h=>`<button class="sl ${h===s.hora?"on":""}" data-h="${h}" ${oc.includes(h)?"disabled":""}>${h}</button>`).join("")}</div>`:'<p class="mut">Não há mais horários neste dia. Escolha outro dia.</p>';
  if(!hs.includes(s.hora)||oc.includes(s.hora)){s.hora="";$("#ok").disabled=true}else $("#ok").disabled=false;
  box.querySelectorAll(".sl").forEach(b=>b.onclick=()=>{s.hora=b.dataset.h;box.querySelectorAll(".sl").forEach(x=>x.classList.toggle("on",x===b));$("#ok").disabled=false})};
 st.querySelectorAll(".d").forEach(b=>b.onclick=()=>{s.data=b.dataset.d;s.hora="";st.querySelectorAll(".d").forEach(x=>x.classList.toggle("on",x===b));slots()});
 if(s.data)slots();$("#vb").onclick=()=>go(3);$("#ok").onclick=()=>go(5)},
()=>{st.innerHTML=`<div class="bub">Confere os dados, ${esc(pn())}. Se estiver tudo certo, é só confirmar.</div><div class="sum"><div><span>Serviços</span><b>${s.svc.map(id=>esc(sv(id).nome)).join("<br>")}</b></div><div><span>Profissional</span><b>${esc(bb(s.barb).nome)}</b></div><div><span>Data</span><b style="text-transform:capitalize">${dlong(s.data)}</b></div><div><span>Horário</span><b>${s.hora}</b></div><div><span>Total</span><b style="color:#6aa4ff;font-size:1.15rem">${V.brl(total())}</b></div></div><p class="er" id="er"></p><div class="row">${back()}<button class="btn" id="ok">Confirmar agendamento</button></div>`;
 $("#vb").onclick=()=>go(4);$("#ok").onclick=async()=>{const b=$("#ok");b.disabled=true;b.textContent="Confirmando...";
  try{await V.criar({nome:s.nome,whatsapp:s.fone,servicos:s.svc.map(id=>({id,nome:sv(id).nome,preco:sv(id).preco})),total:total(),barbeiro:s.barb,data:s.data,hora:s.hora});go(6)}
  catch(e){b.disabled=false;b.textContent="Confirmar agendamento";if(e.message==="ocupado"){$("#er").textContent="Esse horário acabou de ser ocupado. Escolha outro.";setTimeout(()=>{s.hora="";go(4)},1600)}else $("#er").textContent="Não foi possível confirmar agora. Tente de novo em instantes."}}},
()=>{const nomes=s.svc.map(id=>sv(id).nome).join(", "),ini=s.data.replace(/-/g,"")+"T"+s.hora.replace(":","")+"00",m=(+s.hora.slice(0,2))*60+(+s.hora.slice(3))+C.horario.passo,fim=s.data.replace(/-/g,"")+"T"+String(Math.floor(m/60)).padStart(2,"0")+String(m%60).padStart(2,"0")+"00";
 const cal="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("VOKTA Barbearia: "+nomes)+"&dates="+ini+"/"+fim+"&details="+encodeURIComponent("Profissional: "+bb(s.barb).nome)+(C.endereco?"&location="+encodeURIComponent(C.endereco):"");
 const msg=encodeURIComponent(`Olá! Acabei de agendar na ${C.nome}.\nNome: ${s.nome}\nServiço: ${nomes}\nProfissional: ${bb(s.barb).nome}\nDia: ${dlong(s.data)} às ${s.hora}`);
 st.innerHTML=`<div class="ok"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M30 52l14 14 27-30"/></svg><h2>Agendado, ${esc(pn())}!</h2><p class="mut">${dlong(s.data)} às ${s.hora}<br>com ${esc(bb(s.barb).nome)} · ${V.brl(total())}</p>${C.endereco?`<p class="mut">${esc(C.endereco)}</p>`:""}${C.whatsapp?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${C.whatsapp}?text=${msg}">Avisar a barbearia no WhatsApp</a>`:""}<a class="btn s" target="_blank" rel="noopener" href="${cal}">Adicionar ao calendário</a><button class="btn g" id="nv" style="margin-top:10px">Fazer outro agendamento</button></div>`;
 $("#nv").onclick=()=>{s.svc=[];s.barb=null;s.data="";s.hora="";go(2)}}
];
if(!V.remoto)$("#dm").classList.remove("hide");
go(0);
</script></body></html>
